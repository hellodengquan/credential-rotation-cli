[project]
name = "credential-rotation"
version = "0.2.0"
description = "A CLI tool for managing credential rotation and tracking expiry windows"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
keyring = ["keyring>=23.0.0"]
aws = ["boto3>=1.26.0"]
gcp = ["google-cloud-secret-manager>=2.0.0"]
sftp = ["paramiko>=3.0.0"]
s3 = ["boto3>=1.26.0"]
remote = ["boto3>=1.26.0", "paramiko>=3.0.0"]
vault = ["keyring>=23.0.0", "boto3>=1.26.0", "google-cloud-secret-manager>=2.0.0"]
all = [
    "keyring>=23.0.0",
    "boto3>=1.26.0",
    "google-cloud-secret-manager>=2.0.0",
    "paramiko>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
credrot = "credential_rotation.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["credential_rotation*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["credential_rotation", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
    "SIM108",
    "B008",
    "B904",
    "RUF001",
    "RUF002",
    "RUF003",
    "A002",
]

[tool.ruff.lint.isort]
known-first-party = ["credential_rotation"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "keyring.*",
    "google.cloud.*",
    "google.protobuf.*",
    "paramiko.*",
    "rich.*",
    "typer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "timezone: marks tests for timezone drift",
    "leap_year: marks tests for leap year edge cases",
    "remote: marks tests for remote fetching (may need network)",
    "vault_cloud: marks tests for cloud vault backends (need credentials)",
]
